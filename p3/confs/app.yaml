apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: playground
  namespace: argocd

spec:
  project: default

    # repoURL: https://github.com/younesonj/younajja_iot_argocd.git
  source:
    repoURL: https://github.com/Xylar-99/IOT-test.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true